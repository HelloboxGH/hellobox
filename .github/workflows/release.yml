# Weekly release: tags main with a calendar version (YEAR.MONTH.N) when it changed since
# the last release. Runs in the public repo. It never commits to main: the mirror's next
# sync would stop on a commit without a Source trailer. Tags and Releases are safe.
name: Release

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work out the version and notes, but don't tag or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two runs at once could both pick the same N.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the Release. Nothing else in this job writes.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and every tag: the version and "changed since?" need both.
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          calver='^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]*$'

          # Newest release reachable from main. Tags that aren't CalVer are ignored.
          last=$(git tag --merged HEAD | grep -E "$calver" | sort -V | tail -n 1 || true)

          if [ -z "$last" ]; then
            changed=true
            echo "No release yet: this will be the first."
          else
            count=$(git rev-list --count "$last..HEAD")
            if [ "$count" -gt 0 ]; then changed=true; else changed=false; fi
            echo "Last release: $last, $count commit(s) since."
          fi

          # Month without zero padding (11, not 011; 1, never 01). UTC, like the cron.
          prefix="$(date -u +%Y).$(date -u +%-m)"
          # Highest N this month, from all tags (not only merged ones), so N never repeats.
          high=$(git tag --list "$prefix.*" | grep -E "$calver" | sed "s/^$prefix\.//" | sort -n | tail -n 1 || true)
          next="$prefix.$(( ${high:-0} + 1 ))"

          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          # The exact commit this release is for. Main can move while we run (a sync push).
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Release"
            echo "- Last release: ${last:-none}"
            echo "- Changed since: $changed"
            echo "- Next version: $next"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the release notes
        if: steps.version.outputs.changed == 'true'
        # Commit messages are untrusted text (imported PR titles): they only ever pass
        # through files and env, never through ${{ }} inside the script.
        env:
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          range=${LAST:+$LAST..}HEAD
          breaking=$(mktemp)
          changes=$(mktemp)

          for sha in $(git rev-list --reverse --no-merges "$range"); do
            subject=$(git log -1 --format=%s "$sha")
            # Imported contributions carry the public PR number: link it.
            pr=$(git log -1 --format='%(trailers:key=Public-PR,valueonly)' "$sha" | head -n 1 | tr -d ' ')
            echo "- ${subject}${pr:+ ($pr)}" >> "$changes"
            # Any body line starting "Breaking:" goes to the top, without the prefix.
            git log -1 --format=%b "$sha" | sed -n 's/^Breaking:[[:space:]]*//p' | while read -r line; do
              echo "- $line" >> "$breaking"
            done
          done

          {
            if [ -s "$breaking" ]; then
              echo "## ⚠️ Breaking changes"
              echo
              cat "$breaking"
              echo
            fi
            echo "## Changes"
            echo
            cat "$changes"
            echo
            echo "Images: \`ghcr.io/helloboxgh/hellobox-{web,worker}:$VERSION\`"
            echo "and \`helloboxapp/hellobox-{web,worker}:$VERSION\`."
          } > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish the release
        id: publish
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
          SHA: ${{ steps.version.outputs.sha }}
          # Scheduled runs have no inputs: an empty value means "for real".
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would release $VERSION at $SHA."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Creates the tag on GitHub at that exact commit, then the Release. No git push.
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Called, not triggered by the tag: a tag pushed with GITHUB_TOKEN starts no workflow.
  # A failed image build turns this run red too.
  images:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release.outputs.version }}
    # DOCKERHUB_TOKEN. A called workflow sees no secrets unless they're passed.
    secrets: inherit
