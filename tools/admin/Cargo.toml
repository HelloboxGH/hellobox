[package]
name = "hellobox-admin"
version = "0.1.0"
edition = "2024"
description = "Terminal admin tool for HelloBox"
publish = false

[[bin]]
name = "hellobox-admin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
open = "5"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[profile.release]
strip = true
lto = "thin"
