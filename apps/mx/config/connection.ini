; Haraka 3.4.2's connection.ini with HelloBox's values. This file replaces the default
; entirely, so every section Haraka reads must stay here.

[main]

[haproxy]
hosts[] =

[headers]
add_received=true
; Strip Authentication-Results headers the sender wrote. HelloBox checks SPF, DKIM and DMARC itself.
clean_auth_results=true
show_version=false
max_lines=1000
max_received=100

[max]
; 25 MB, refused at SIZE with 552
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992

[message]
helo=HelloBox mail server
close=Bye

[uuid]
banner_chars=6
deny_chars=0
