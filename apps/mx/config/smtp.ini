; Haraka's core settings for HelloBox's mail server. Files not in this folder keep Haraka's
; defaults; a file that is here replaces the default one entirely, so keep each complete.
;
; Docker maps port 25 to 2525: the server runs as a normal user, which can't open ports
; below 1024. One process (nodes unset): the per-IP limit and the domain cache live in its memory.
listen=[::0]:2525
