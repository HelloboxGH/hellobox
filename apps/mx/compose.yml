# HelloBox's mail server on its own, next to a HelloBox that runs anywhere. It needs no
# database or Redis: only HelloBox's address and the signing key. Set these variables in
# your platform's environment settings (Dokploy: the Environment tab), or in a .env file
# next to this one with `docker compose up -d`:
#
#   MX_HOSTNAME      the name your MX records point at, like mx1.example.com
#   HELLOBOX_URL     HelloBox's address, like https://hellobox.example.com
#   MX_SIGNING_KEY   the same value as on the HelloBox web app (openssl rand -hex 32)
#   MX_OPEN          true once you're ready to take mail; until then every sender gets 450
#   MX_IMAGE         optional, the image to run
#   MX_CERTS         optional, the folder with key.pem and cert.pem (default ./certs)
#
# Port 25 is published straight on the host, so the server sees each sender's real IP
# (SPF and the per-IP limit need it). The certificate is renewed outside the container;
# without one, STARTTLS is off.
name: hellobox-mx

services:
  mx:
    image: ${MX_IMAGE:-ghcr.io/helloboxgh/hellobox-cloud-mx:latest}
    restart: unless-stopped
    environment:
      MX_HOSTNAME: ${MX_HOSTNAME:?Set MX_HOSTNAME}
      HELLOBOX_URL: ${HELLOBOX_URL:?Set HELLOBOX_URL}
      MX_SIGNING_KEY: ${MX_SIGNING_KEY:?Set MX_SIGNING_KEY}
      MX_OPEN: ${MX_OPEN:-false}
    ports:
      - "25:2525"
    volumes:
      - ${MX_CERTS:-./certs}:/certs:ro
    # Strangers talk to this, so it can do no more than it needs.
    read_only: true
    # Owned by the image's user (node, uid 1000): a plain tmpfs belongs to root, and the
    # server writes its settings to /run/haraka at start.
    tmpfs:
      - /run/haraka:uid=1000,gid=1000,mode=0700,size=64m
      - /tmp:uid=1000,gid=1000,mode=0700,size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
